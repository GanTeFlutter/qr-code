name: qrcode_akillisletme
description: "QR kod tarama, olusturma ve yonetme uygulamasi."

publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: ^3.10.7

dependencies:
  audioplayers: ^6.5.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.1
  equatable: ^2.0.5
  firebase_core: ^4.4.0
  firebase_remote_config: ^6.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.0
  gal: ^2.3.2
  get_it: ^8.0.3
  go_router: ^17.1.0
  hive_ce: ^2.11.3
  image_cropper: ^11.0.0
  image_picker: ^1.2.1
  json_annotation: ^4.8.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  qr: ^3.0.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  go_router_builder: ^4.2.0
  hive_ce_generator: ^1.10.0
  json_serializable: ^6.6.1
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/poppins/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/font/inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/font/inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
